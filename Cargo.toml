[package]
name = "tungsten-cli"
description = "Another command line tool to manage Roblox assets similar to Tarmac and Asphalt."
version = "3.0.0"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://pwnwrkz.github.io/tungsten-docs"
repository = "https://github.com/pwnwrkz/tungsten/"
keywords = ["roblox", "assets", "sync", "upload"]

exclude = [
    ".github/**",
    "assets",
    "assets/**",
    "examples",
    "examples/**",
]
include = [
    "src/",
    "src/**"
]

[dependencies]
anyhow = "1.0"
bit-vec = "0.10"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
crunch = "0.5"
futures-util = "0.3"
glob = "0.3"
hex = "0.4"
image = { version = "0.25", features = ["jpeg", "bmp", "tga"] }
crossterm = "0.28"
inquire = { version = "0.9", features = ["crossterm"] }
libcaesium = "0.20"
notify = "8.2"
rayon = "1.11"
rbx_binary = "3.0"
rbx_xml = "3.0"
relative-path = { version = "2.0.1", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "multipart", "blocking"] }
resvg = "0.47"
roblox_install = "1.0"
rbx_install = { path = "../rbx_install" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
tiny-skia = "0.12"
tokio = { version = "1.50", features = ["full"] }
toml = "1.1"
usvg = "0.47"

[[bin]]
name = "tungsten"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
